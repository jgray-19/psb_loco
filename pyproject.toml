[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psb-loco"
version = "0.1.0"
description = "PSB ring-3 LOCO: quadrupole k1 recovery from measured orbit response, by POCO."
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Joshua Gray" }]
dependencies = [
    "adelmo",
    "matplotlib",
    "numpy",
    "pandas",
    "psb-md",
    "pyarrow",
    "tfs-pandas",
    "tmom-recon",
    "turn_by_turn==1.5.0",
]

[project.optional-dependencies]
test = ["pytest", "xsuite", "xtrack-tools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["loco_common*", "loco_report*", "poco*", "phase_advance_constraint*"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
adelmo = { path = "../sgd-magnet-tuner", editable = true }
psb-md = { path = "../psb_md", editable = true }
tmom-recon = { path = "../tmom-recon", editable = true }
xtrack-tools = { path = "../xtrack-tools", editable = true }

[tool.pytest.ini_options]
markers = [
    "slow: spawns MAD-NG or tracks with xsuite",
    "serial: must not run under pytest-xdist",
]
addopts = "-m 'not slow'"
testpaths = ["tests"]
